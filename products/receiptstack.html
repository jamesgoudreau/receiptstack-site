<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Receipt Stack — every receipt, saved for good</title>
  <meta name="description" content="Scroll to fly through the journey of a receipt — from crumpled chaos to a tidy, searchable archive in your own cloud." />
  <style>
    :root, .sw-root {
      --sw-bg: #f4f8f7;          /* scene background colour */
      --sw-ink: #1a2b2a;
      --sw-ink-soft: #5b6f6d;
      --sw-accent: #03605c;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>
  <footer style="background:#f4f8f7;color:#5b6f6d;text-align:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <p style="margin:0 0 6px"><a href="../privacy.html" style="color:#03605c">Privacy Policy</a> &middot; <a href="../terms.html" style="color:#03605c">Terms</a> &middot; <a href="../support.html" style="color:#03605c">Support</a></p>
    <p style="margin:0">A Maritime Digital product.</p>
  </footer>

  <script src="receiptstack/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Receipt Stack', href: '#top' },
      cta: { label: 'Get the app', href: '#finale' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'counter', label: 'Snap It',
          still: 'receiptstack/assets/counter.webp',
          clip: 'receiptstack/assets/vid/counter.mp4',
          clipMobile: 'receiptstack/assets/vid/counter-m.mp4',
          stillMobile: 'receiptstack/assets/counter-m.webp',
          accent: '#03605c',
          scroll: 1.8, linger: 0.45,
          eyebrow: 'Every purchase, everywhere',
          title: 'Snap it before it crumples.',
          body: 'Receipts fade, crumple and vanish — so point your phone at one right at the counter and move on.',
          tags: ['Photos', 'PDFs', 'Share sheet'],
        },
        {
          id: 'workshop', label: 'Auto-Read',
          still: 'receiptstack/assets/workshop.webp',
          clip: 'receiptstack/assets/vid/workshop.mp4',
          clipMobile: 'receiptstack/assets/vid/workshop-m.mp4',
          stillMobile: 'receiptstack/assets/workshop-m.webp',
          accent: '#024744',
          eyebrow: 'On-device smarts',
          title: 'It reads the receipt for you.',
          body: 'Vendor, date, amounts and tax are picked out automatically — right on your phone, never on a server.',
          tags: ['Private OCR', 'No cloud AI', 'You confirm'],
        },
        {
          id: 'vault', label: 'Your Cloud',
          still: 'receiptstack/assets/vault.webp',
          clip: 'receiptstack/assets/vid/vault.mp4',
          clipMobile: 'receiptstack/assets/vid/vault-m.mp4',
          stillMobile: 'receiptstack/assets/vault-m.webp',
          accent: '#024744',
          scroll: 1.5, linger: 0.35,
          eyebrow: 'Yours, not ours',
          title: 'Filed in your own cloud.',
          body: 'Every receipt lands in tidy year and month folders in your Google Drive or iCloud — we never hold your data.',
          tags: ['Google Drive', 'iCloud Drive', 'Never deleted'],
        },
        {
          id: 'ledger', label: 'The Index',
          still: 'receiptstack/assets/ledger.webp',
          clip: 'receiptstack/assets/vid/ledger.mp4',
          clipMobile: 'receiptstack/assets/vid/ledger-m.mp4',
          stillMobile: 'receiptstack/assets/ledger-m.webp',
          accent: '#03605c',
          eyebrow: 'Tax time, handled',
          title: 'A yearly index writes itself.',
          body: 'Dates, vendors, totals and tax — one clean spreadsheet per year, ready when your accountant asks.',
          tags: ['Google Sheets', 'CSV'],
        },
        {
          id: 'finale', label: 'Receipt Stack',
          still: 'receiptstack/assets/hero.webp',
          clip: 'receiptstack/assets/vid/hero.mp4',
          clipMobile: 'receiptstack/assets/vid/hero-m.mp4',
          stillMobile: 'receiptstack/assets/hero-m.webp',
          accent: '#03605c',
          scroll: 1.7, linger: 0.45,
          eyebrow: 'Receipt Stack',
          title: 'Every receipt, saved for good.',
          body: 'Free to try, private by design, and your archive belongs to you forever.',
          tags: [],
          cta: { primary: { label: 'Coming soon to the App Store', href: '../support.html' },
                 secondary: { label: 'Get in touch', href: '../support.html' } },
        },
      ],
      connectors: [
        'receiptstack/assets/vid/conncw.mp4',
        'receiptstack/assets/vid/conn3.mp4',
        'receiptstack/assets/vid/conn4.mp4',
        'receiptstack/assets/vid/conn5.mp4',
      ],
      connectorsMobile: [
        'receiptstack/assets/vid/conncw-m.mp4',
        'receiptstack/assets/vid/conn3-m.mp4',
        'receiptstack/assets/vid/conn4-m.mp4',
        'receiptstack/assets/vid/conn5-m.mp4',
      ],
    });
  </script>
</body>
</html>
